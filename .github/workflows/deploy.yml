# Publish to GitHub Pages — and the auto-rebuild that makes the site the org's
# mirror. Rebuilds on a daily schedule and whenever a sibling repo fires a
# `repository_dispatch` (event type: rebuild-site) after a push or release, so a
# maintainer changing the roadmap never touches this repo.
#
# Publishes to GitHub Pages (custom domain lemonfiber.app, set via public/CNAME).
# Rebuilds on: a push to main, a daily schedule, and a `repository_dispatch`
# (rebuild-site) fired by sibling repos after a push or release — so the site
# tracks the org without anyone editing this repo.
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *" # daily, keeps the site fresh even with no repo activity
  repository_dispatch:
    types: [rebuild-site]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (fetches live org data)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
