[files]
# The Dutch dictionaries are prose in another language, and typos only carries
# an English one — "Transparantie", "Installeer" and "Alle" are all correct
# Dutch and all look like English misspellings. Excluding the files is the only
# honest option; the alternative is an allowlist that grows with every sentence
# and quietly disables the check for English too.
extend-exclude = ["src/i18n/nl.ts", "src/i18n/pages-nl.ts", "src/i18n/faq.ts"]

[default]
# Ignore hotkey mockup notation like [e]rror, [s]ervice in TUI/console examples.
extend-ignore-re = ["\\[[a-z]\\][a-zA-Z]+"]

[default.extend-words]
lemonfiber = "lemonfiber"
Servarr = "Servarr"
Astro = "Astro"
Seerr = "Seerr"
ratatui = "ratatui"
Ratatui = "Ratatui"
